rationale: >-
  bind-adapter was handed owed work sent back to it more times than the
  project's policy allows, so this proposal is ruled by tech-lead rather than
  put to G3's holder for another round.

  - requests from build-slice-12: sent to bind-adapter 3 times, past the limit
  of 2 that policy.loops.request sets. What each send asked for:
    1. R-3.8: organizationEdit.pendingBadge read "" because it matches /^pending$/ against main-text lines, and a table row's text is one line of tab-separated cells; the team table on /organizations/<id>/edit?tab=team draws a cell reading "Pending" in the Membership column of the invitee's row (Isolde Brackwater), so read that column's cell rather than whole lines
    2. R-3.32: organizationEdit.pendingBadge read "" for the same reason as R-3.8; the team table on /organizations/00000000-0000-4000-8000-000000000304/edit?tab=team shows Rosalind Fenwhistle's Membership cell as "Pending", so read the Membership column cell
    3. R-3.23: organizationEdit.ownerBadge read "" because it matches /^owner$/ against whole main-text lines; the team table on the newly registered organization's ?tab=team shows the registrant's row "Blake Placeholder (you)" with the Membership cell "Owner", so read that column's cell
    4. R-3.9: organizationUserMembershipsSelf.pendingBadge filters rows with /(^| \| )pending$/, but the row in "Organizations you belong to" on /users/me?tab=organizations reads "Salt Marsh Labs Ltd. | Pending | Accept … Decline …", with the action buttons after the Membership cell; read the Membership column instead of requiring the row to end in 'pending'
    5. R-3.34: organizationEdit.teamCapabilities keeps only lines matching /capabilit/i, which drops the capability list items; the "Team capabilities" region on ?tab=team lists each capability as "<name>: held" or "<name>: not held" (for example "Technical Architecture: not held"), so return that region's list items
    6. R-3.13: organizationEdit.changeOwner reports "offers no chooser of people" because it looks only for role combobox; after "Change owner" is pressed on ?tab=team, the open dialog "Change owner" draws a select rendered as a button ("Select an item" / "New owner") that opens a listbox of eligible members — bind that
    7. R-3.12: organizationEdit.acceptOrgAdminTerms reports no terms box on ?tab=team because it searches before the box exists; the statement checkbox is inside the confirmation dialog that the row button "Give administrator rights to <name>" opens, and toggleMemberAdminStatus looks for a checkbox or switch in the row when the row offers that button (and "Remove administrator rights from <name>") instead
    8. R-3.15: the same acceptOrgAdminTerms and toggleMemberAdminStatus binding as R-3.12 — the terms checkbox lives in the dialog opened by "Give administrator rights to Dana Placeholder" on /organizations/00000000-0000-4000-8000-000000000304/edit?tab=team
    9. R-3.33: the same acceptOrgAdminTerms and toggleMemberAdminStatus binding as R-3.12 — the terms checkbox lives in the dialog opened by the row's "Give administrator rights to <name>" button on ?tab=team
    10. R-3.14: organizationEdit.teamMemberRow reported unbound because /organizations/:orgId/edit drew "Page not found" for the viewer it walked as; that screen is how this target refuses a person who may not see the organization (R-3.3), so for the ordinary member and the outsider the refusal is the not-found page and should be read as refused, not as an unbound screen
    11. R-3.10: organizationEdit.teamMemberRow returned rows that name people ("Dana Placeholder | Member | 3 | …"), and the test compares them with the leaving member's email "org.member@example.test"; the member is on the list by name, so the binding must report the rows in terms the test's persona can be matched against (the persona's name for that email)
    12. R-3.35: organizationUserMembershipsSelf.declineConfirmation returned the open dialog "Join Northern Pines Digital Ltd.?…" at ?answer=accept; answerDialog returns whichever dialog is open, so it must return the dialog only when it is the decline confirmation (and acceptConfirmation only for the accept one)
    13. R-3.30: organizationEdit.fieldError reads only aria-invalid textboxes, but the team screen reports an unregistered address after the invite dialog closes as a warning alert above the team table titled "<address> is not registered with the Digital Marketplace"; bind the R-3.30 read to that alert
    14. organizationEdit.fieldError in tests/adapters/new/index.ts (around line 5444) reads the Team members region's role=alert elements immediately after removeTeamMember. removeTeamMember (orgInRow, then confirmIfAsked) does not wait for the DELETE /api/affiliations/<id> answer, and the refusal alert is drawn only once that answer arrives. In verify of slice 12 (proposal build-slice-12-4) R-3.11 read "" at line 12, yet the failure outline .sdlc/evidence/slice-12/R-3.11.txt taken moments later shows alert 'That change could not be made' with 'This is the sole owner for the organization, and cannot be removed.' inside region 'Team members'. R-3.11 has failed, passed and failed across three verify runs with the application's removal path unchanged. Make removeTeamMember wait for the membership request to settle, or make fieldError wait for an alert to appear in the team region within the normal timeout, before reading, so a refusal drawn after the response is read rather than missed.
    15. R-3.28: organizationEdit.serviceAreaCheckbox, read as the administrator on /organizations/<id>/edit with the Team With Us qualification section closed, did not report the approvals the page shows. .sdlc/evidence/slice-12/R-3.28.png shows the region 'Approved service areas' listing exactly 'Agile coach' and 'Full stack developer', with an 'Edit service areas' button beneath it. Because that button is present, the member skips the listed approvals and opens the edit form to read ticked checkboxes, and that read did not yield both areas. Read the approvals from the 'Approved service areas' list whenever the form is not already open, whether or not an 'Edit service areas' button is offered.
    16. R-8.31: opportunityCwuEdit.deleteOpportunity returned before the deletion had finished. The outline captured at failure (.sdlc/evidence/slice-12/R-8.31.txt) is still /opportunities/code-with-us/<id>/edit, with the Edit, Submit for review and Delete actions all disabled, meaning the delete was still in flight. The screenshot taken afterwards (.sdlc/evidence/slice-12/R-8.31.png) is the Dashboard, so the deletion did complete. The fileDownload read that followed ran before the delete finished and was let through. After confirming the delete, wait until the management page has been left (the URL is no longer the opportunity's edit page) before returning.
