rationale: >-
  bind-adapter was handed owed work sent back to it more times than the
  project's policy allows, so this proposal is ruled by tech-lead rather than
  put to G3's holder for another round.

  - requests from build-slice-15: sent to bind-adapter 4 times, past the limit
  of 2 that policy.loops.request sets. What each send asked for:
    1. R-1.31, R-2.25: opportunityCwuEdit.proposalsTab() returned the whole Proposals section text, "Proposals Proposals are not shown until the opportunity closes … can be read once it has closed to proposals, at …", at /opportunities/code-with-us/<id>/edit?tab=proposals for public sector staff and the administrator. The page shows the refusal and no proposals; the binding must answer empty when the section withholds proposals and lists none, not return the refusal message as content (evidence .sdlc/evidence/slice-15/R-1.31.txt, R-2.25.txt).
    2. R-2.19: opportunitySwuCreate.publish({ completionDate: inDays(90) }) filled the opportunity-level completion date into the first box labelled 'Completion date' on /opportunities/sprint-with-us/create, which is the Prototype phase group's. The page outline shows the prototype completion as 2027-01-02 where addPhase had set inDays(60), so the form refused with 'the implementation phase cannot start before the phase before it ends' and opportunitySwuEdit.opportunityIdentifier() read "". Publish must not write phase-group date boxes; a Sprint With Us form's dates belong to the phase groups (evidence .sdlc/evidence/slice-15/R-2.19.txt).
    3. R-2.7, R-2.9, R-2.10, R-2.11, R-2.16, R-2.18, R-2.20, R-2.22, R-2.24: proposal-swu-create.*, proposal-twu-create.*, proposal-swu-edit.* and proposal-twu-edit.* (choose_organization, start_editing, withdraw_proposal and the rest) are reported unbound with the reason that the running build serves only /dashboard, /opportunities and the account screens. This build serves /opportunities/sprint-with-us/:opportunityId/proposals/create, /opportunities/team-with-us/:opportunityId/proposals/create and both programs' /proposals/:proposalId/edit (app/frontend/src/router.tsx), with an organization chooser, team sections and submit/withdraw actions; bind them against it. proposal-cwu-view.open, used by R-2.24, is also reported unbound although that page was already served before this slice.
    4. R-2.19: in the cases "a team for a phase the opportunity does not have is not submitted" and "a proposal leaving out a phase the opportunity has is not submitted", proposalTeamRequest.refusalByField() returned the service's raw lines 'inceptionPhase: This opportunity does not require this phase.' and 'prototypePhase: This opportunity requires this phase.' The service names the phase by its request field key (inceptionPhase, prototypePhase, implementationPhase); the binding must report each entry against the phase's name (Inception, Prototype, Implementation) so the refusal reads as standing against that phase (evidence .sdlc/evidence/slice-15/R-2.19-2.txt, R-2.19-3.txt).
    5. R-2.25: proposal-swu-view (and proposal-twu-view) are reported unbound with the reason that the running build serves a signed-in person only /dashboard and similar. This build serves /opportunities/sprint-with-us/:opportunityId/proposals/:proposalId and the Team With Us equivalent (app/frontend/src/router.tsx, screen proposal-team-view.tsx), reached from each row of the opportunity manage page's Proposals tab, with proposal-proponent-name, proposal-identifier, proposal-status, proposal-tab-proposal, proposal-tab-history and proposal-export-link; bind them against it.
    6. tests/adapters/new/index.ts opportunity-swu-create add_phase (addPhase, around line 4830) fills only startDate and completionDate and silently drops the maxBudget and capabilities its input carries (R-2.19.spec.ts publishSprintOpportunity passes maxBudget 200000/300000 and capabilities ['Frontend Development']/['Backend Development']). It must fill the phase group's maximum budget box and tick each named required capability once the application's opportunity form offers them, and report unbound if a given field has no box rather than dropping it. As things stand, R-2.19's two form cases (phase incomplete for a missing capability; phase cost over its budget) cannot fail or pass on the application's merits.
    7. R-2.7: proposalSwuCreate.setScrumMaster threw 'Charlie Placeholder is not on the implementation phase's team' because tickScrumMaster (tests/adapters/new/index.ts:13451-13461) only matches a radio named /^scrum master: <name>,/; the page (.sdlc/evidence/slice-15/R-2.7.txt lines 44-51) shows Charlie Placeholder in the phase's team list and a radiogroup named 'Scrum master for the implementation phase (required)' holding a radio named 'Charlie Placeholder', with test ID proposal-scrum-master. Find the radio by the member's name inside the phase's 'Scrum master for the <phase> phase' radiogroup (or by proposal-scrum-master within the phase group), and change onPhase (index.ts:13448) to match the same way.
    8. R-2.9: same failure as R-2.7. proposalSwuCreate.setScrumMaster looks for a radio named 'Scrum master: Charlie Placeholder, implementation phase', but the page (.sdlc/evidence/slice-15/R-2.9.txt) names the radio 'Charlie Placeholder' inside the radiogroup 'Scrum master for the implementation phase (required)'.
    9. R-2.11: same failure as R-2.7. proposalSwuCreate.setScrumMaster looks for 'Scrum master: Charlie Placeholder, implementation phase', but the page (.sdlc/evidence/slice-15/R-2.11.txt) names the radio 'Charlie Placeholder' inside the radiogroup 'Scrum master for the implementation phase (required)'.
    10. R-2.16: same failure as R-2.7 for 'Blake Placeholder'. proposalSwuCreate.setScrumMaster looks for 'Scrum master: Blake Placeholder, implementation phase', but the page (.sdlc/evidence/slice-15/R-2.16.txt) names the radio 'Blake Placeholder' inside the radiogroup 'Scrum master for the implementation phase (required)'.
    11. R-2.18: proposalSwuCreate.pendingTeamMember read '' because addPhaseTeamMember never added the pending person. pickListed (tests/adapters/new/index.ts:13342) accepts an option only as '<Name>' or '<Name> (pending)', but the phase's chooser offers 'Quinn Placeholder (membership pending)', the catalogue's wording (design/catalogue/proposal-swu-create.default.stories.tsx:21, DESIGN.md:4314). Accept '<Name> (membership pending)'. The second R-2.18 case failed on the same scrum master name as R-2.7 (.sdlc/evidence/slice-15/R-2.18-2.txt: radio 'Blake Placeholder' in radiogroup 'Scrum master for the implementation phase (required)').
    12. R-2.19: same failure as R-2.7. setScrumMaster looks for 'Scrum master: <Name>, <phase> phase', but the page names each radio by the member alone inside 'Scrum master for the <phase> phase (required)' (.sdlc/evidence/slice-15/R-2.19.txt, R-2.19-2.txt, R-2.19-3.txt). The three cases verify did not describe (missing phase capability, phase cost over budget, total cost over budget) run through the same step; re-check them once it binds.
    13. R-2.22: same failure as R-2.7, on both proposalSwuEdit.setScrumMaster and proposalSwuCreate.setScrumMaster. The adapter looks for 'Scrum master: Blake Placeholder, implementation phase', but the create and edit forms (.sdlc/evidence/slice-15/R-2.22.txt, R-2.22-2.txt, R-2.22-3.txt) name the radio 'Blake Placeholder' inside the radiogroup 'Scrum master for the implementation phase (required)'.
