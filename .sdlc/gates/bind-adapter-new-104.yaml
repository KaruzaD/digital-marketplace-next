gate: G3
verdict: escalated
by: runner:bind-adapter
held_by: runner
escalate_to: tech-lead
rationale: >-
  bind-adapter was handed owed work sent back to it more times than the
  project's policy allows, so this proposal is ruled by tech-lead rather than
  put to G3's holder for another round.

  - requests from build-slice-10: sent to bind-adapter 5 times, past the limit
  of 2 that policy.loops.request sets. What each send asked for:
    1. R-1.8: opportunitySwuView.status() returns the line after one reading exactly 'Sprint With Us', which this page never draws. The page at /opportunities/sprint-with-us/<id> shows a paragraph 'Sprint With Us opportunity' and then a 'Status' term whose value read 'Draft' (.sdlc/evidence/slice-10/R-1.8.txt), yet the adapter read ''. Read the value given under the 'Status' term (the design story marks it data-testid opportunity-status).
    2. R-1.18: opportunityTwuView.status() has the same fault on /opportunities/team-with-us/<id>: it looks for a line reading exactly 'Team With Us' and the page shows the state under a 'Status' term, so all four reads returned ''. Read the value under 'Status'.
    3. R-1.43: opportunitySwuView.status() read '' on /opportunities/sprint-with-us/00000000-0000-4000-a011-000000000001, whose 'Status' term reads 'Team questions: consensus' (.sdlc/evidence/slice-10/R-1.43.txt). Read the value under 'Status' rather than the line after an exact program-name line.
    4. R-1.48: opportunitySwuView.status() read '' on the created opportunity's view, which shows its state under a 'Status' term. Same fix as R-1.8. Separately, programForm.setPanel ignores the top-level 'chair' given to setEvaluationPanel({members, chair}) and only reads a per-member chair flag, so no Chair box is ticked and the create form refuses with 'Evaluation panel: choose a chair'. Tick the Chair box of the member the input names as chair.
    5. R-1.53: opportunitySwuView.status() read '' on /opportunities/sprint-with-us/<id>, where the state is shown under a 'Status' term. Same fix as R-1.8.
    6. R-1.13: opportunityTwuCreate.setEvaluationPanel({members, chair}) never ticks the Chair box of the member named by the top-level 'chair', because programForm.setPanel reads 'chair' only on each member. The form then refused with 'Evaluation panel: choose a chair. The panel needs one person to record the agreed scores.' (.sdlc/evidence/slice-10/R-1.13.txt). Apply the top-level chair to the matching member's Chair box.
    7. R-1.16: after a publish the form refused, opportunitySwuEdit.opportunityIdentifier() read 'create' from /opportunities/sprint-with-us/create and returned it as an opportunity id, so the test 'viewed' the create form and phases() read ''. Return '' while the page is still the create form, so the test takes its 'nothing was created' branch. setEvaluationPanel's chair must also be applied, as for R-1.13.
    8. R-1.17: the publish was refused because setEvaluationPanel ticked no chair (see R-1.13), and opportunityIdentifier() then returned 'create', so opportunitySwuView.status() was read on /opportunities/sprint-with-us/create and returned ''. Apply the top-level chair, return no identifier from the create form, and read status under the 'Status' term.
    9. R-5.17: setEvaluationPanel({members: [first, second], chair: second}) ticked no chair, the publish stayed on /opportunities/sprint-with-us/create, and opportunityIdentifier() returned 'create', so every status() read was taken on a blank create form (.sdlc/evidence/slice-10/R-5.17.png). Apply the top-level chair, return no identifier from the create form, and read status under 'Status'.
    10. R-5.16: evaluationPanelSwu was opened at /opportunities/sprint-with-us/create/edit?tab=evaluationPanel because the id it was given was 'create', returned by opportunityIdentifier() after a create refused for want of a chair. The panel tab does open for a real opportunity, as R-1.55's evidence at /opportunities/sprint-with-us/<id>/edit?tab=evaluationPanel shows. Fix the chair and identifier faults and the binding has a real opportunity to open.
    11. R-1.55: on /opportunities/sprint-with-us/<id>/edit?tab=evaluationPanel the 'Public sector employee' chooser correctly does not offer the vendor. addPanelMember's pick() calls noteRefusal and returns false without throwing, while the test reads a refusal only from a throw, so it concluded the vendor was added and found only the administrator. When the chooser does not offer the person asked for, addPanelMember must raise the refusal.
    12. R-5.1: same fault as R-1.55. evaluationPanelSwu.addPanelMember({member: vendor}) found the vendor not offered by the chooser, noted the refusal and returned normally, so the test's refused() saw no refusal and failed when panelMemberRow() lacked the vendor. Raise the refusal when the chooser does not offer the person.
    13. R-1.19: opportunitySwuView.status() read '' on /opportunities/sprint-with-us/00000000-0000-4000-8000-000000000701, whose 'Status' term reads 'Published' (.sdlc/evidence/slice-10/R-1.19.txt). Read the value under 'Status'.
    14. opportunityTwuView.maxBudget reads the figure under /^maximum contract value$/i, the old application's label. The new view shows it under 'Maximum budget' (data-testid opportunity-max-budget), so R-1.13's 'Team With Us maximum budget has no upper limit' case read an empty string from a published opportunity.
    15. opportunitySwuEdit.teamQuestionsTab and opportunityTwuEdit.resourceQuestionsTab are bound as absentSection, but the new manage page shows the saved questions on its Opportunity tab. R-1.17's two 'a draft may be saved holding a question outside these limits' cases got an empty string after the draft was saved.
    16. in R-1.56's 'an administrator changes the details of a published opportunity' case, for both Sprint With Us and Team With Us, the description is read while the page is still showing the edit form ('Opportunity / Overview / Title(required)...'), not the saved opportunity. Read the description from the view (or the manage page after saving) once the edit is saved.
    17. opportunitySwuCreate.addTeamQuestion (and, by the same pattern, opportunityTwuCreate.addResourceQuestion) must fill the form's existing blank question row before pressing 'Add a team question' / 'Add a resource question', as addResource already does for 'Resource 1'. The Sprint With Us and Team With Us create forms open with one blank question (opportunity-other-form.tsx:165, questions: [BLANK_QUESTION]). The driver presses Add for every question, so after 100 presses the form holds 101 rows and the button correctly disables at 101 (QUESTIONS_MAX). Verify on build-slice-10-4 failed both 101-question R-1.17 cases at R-1.17.spec.ts:100, inside the setup loop, with 'the control named /add a team question/ is disabled'. The spec never reached its 102nd question.
    18. R-1.43: evaluationPanelSwu.panelMemberRow() read "" on /opportunities/sprint-with-us/00000000-0000-4000-a011-000000000001/edit?tab=evaluationPanel at the consensus stage. The page shows the lock note and, in the 'Evaluation panel' region, a list 'Members of the evaluation panel' whose items (data-testid evaluation-panel-member-row) read 'Casey Placeholder Role : Evaluator' and 'Robin Placeholder Role : Evaluator and chair'. rows() passes these list items to rowsText(), which reads only role=cell children, and list items have none; read each row's own text (name, then the role after the visually hidden 'Role:').
    19. R-5.18: evaluationPanelSwu.panelMemberRow() never read non-empty on /opportunities/sprint-with-us/00000000-0000-4000-a023-000000000001/edit?tab=evaluationPanel as the administrator. The panel now opens read-only: the list 'Members of the evaluation panel' shows 'Robin Placeholder Role : Evaluator and chair' and 'Devon Placeholder Role : Evaluator', followed by the 'Edit evaluation panel' button (evaluation-panel-edit). For a panel without a lock note, rows() reads each name from a chooser inside the row, which a read-only row lacks, so every row is skipped. Read the read-only rows' text, and use the chooser only once editing has started.
    20. R-1.55: after a fresh draft is saved, evaluationPanelSwu.open then panelMemberRow() times out reading "" (tests/acceptance/opportunities/R-1.55.spec.ts:131), while the page shows the read-only list item 'Robin Placeholder Role : Evaluator and chair' and 'Edit evaluation panel'. Same cause as R-5.18: rows() needs a member chooser, and the read-only panel has none.
    21. R-5.1: evaluationPanelSwu.panelMemberRow() times out reading "" (tests/acceptance/evaluation/R-5.1.spec.ts:94) on a fresh Sprint With Us draft's panel tab, which shows the read-only item 'Casey Placeholder Role : Evaluator and chair' and 'Edit evaluation panel'. Same cause as R-5.18: rows() reads names only from choosers.
    22. R-5.17: evaluationPanelSwu.panelMemberRow() times out reading "" (tests/acceptance/evaluation/R-5.17.spec.ts:91) on a published opportunity's panel tab, which shows the read-only items 'Casey Placeholder Role : Evaluator' and 'Emery Placeholder Role : Evaluator and chair' and 'Edit evaluation panel'. Same cause as R-5.18: rows() reads names only from choosers.
    23. R-1.55: evaluation-panel-swu.add_panel_member clicked "Add an evaluator" and timed out because the Evaluation panel section was still read-only: the page shows the members list and an "Edit evaluation panel" button (data-testid evaluation-panel-edit) that has to be pressed first, as start_editing already does. Once editing, the person is picked in one "Public sector employee to add" chooser (evaluation-panel-member-choice), with entries reading "Name (email)", and then "Add an evaluator" (evaluation-panel-add-member) seats them as a new evaluator row; member rows no longer have their own chooser. Seen in .sdlc/evidence/slice-10/R-1.55.txt and R-1.55-2.txt at /opportunities/sprint-with-us/<id>/edit?tab=evaluationPanel.
    24. R-5.1: same cause as R-1.55. add_panel_member was called on the read-only Evaluation panel section (members listed, "Edit evaluation panel" button shown) without pressing that button, then waited for "Add an evaluator" until it timed out. It must enter editing first, then add through the single "Public sector employee to add" chooser and "Add an evaluator". Seen in .sdlc/evidence/slice-10/R-5.1.txt and R-5.1-2.txt.
    25. R-5.17: in the published case, chair_field read "" and mark_member_as_chair reported no evaluator named "Emery Placeholder" ("nobody chosen, nobody chosen") although the read-only section lists "Casey Placeholder, Role: Evaluator" and "Emery Placeholder, Role: Evaluator and chair" above an "Edit evaluation panel" button. The adapter looked for per-row choosers and the Chair chooser without entering editing. Once editing, each seated member is a fieldset whose paragraph reads "Name (email)" beside a Chair checkbox (evaluation-panel-member-chair). In the draft case, add_panel_member timed out on "Add an evaluator" for the same reason as R-1.55. Seen in .sdlc/evidence/slice-10/R-5.17.txt and R-5.17-2.txt.
