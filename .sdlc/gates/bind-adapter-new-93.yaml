escalate_to: tech-lead
rationale: >-
  bind-adapter was handed owed work sent back to it more times than the
  project's policy allows, so this proposal is ruled by tech-lead rather than
  put to G3's holder for another round.

  - requests from build-slice-8: sent to bind-adapter 3 times, past the limit of
  2 that policy.loops.request sets. What each send asked for:
    1. the opportunity list's group readers (unpublishedGroup, openGroup, closedGroup) look for headings reading "Unpublished opportunities", "Open opportunities" and "Closed opportunities". The catalogue's opportunity-list stories (default and staff) and the application head the groups "Unpublished", "Open" and "Closed", so every group reads as empty and R-1.3 and R-1.38 fail with an empty string. Read the groups by the headings the application shows.
    2. content-service-level-agreement-link.answer_at_link_target looks for the service level agreement link again after follow_service_level_agreement_link has already navigated to the page it leads to. That page carries no such link, so the reader returns an empty string, and R-7.18 fails although /content/service-level-agreement answers with the page (its title, dates, body and address are all in main). Read the answer from the page the link led to.
    3. the new target's opportunityList group readers (opportunityGroup in tests/adapters/new/index.ts) must read a group's rows from inside that group's own section on the page, not as the text lines that follow its heading up to the next group heading, and must open a collapsed group before reading it. On the slice 8 run the Closed Opportunities group was collapsed and was the last group, so the reader took the program descriptions panel that follows it as its rows, never opened it, and reported the seeded closed Sprint With Us opportunity missing for an administrator.
    4. R-1.3: in both cases (public sector staff; administrator) opportunityList.openGroup() read '' at /opportunities, but the page shows 'Seeded published Code With Us opportunity' as a level-3 heading inside the region whose heading is 'Open Opportunities 3' (evidence R-1.3.txt and R-1.3-2.txt). The open group's heading name includes its count, and OPPORTUNITY_GROUPS in tests/adapters/new/index.ts (/^open(?: opportunities)?$/i and its siblings) is anchored so that it does not match 'Open Opportunities 3', so groupSection and the heading fallback both find nothing and opportunityGroup returns ''. Match a group heading or region whose name is followed by a count, e.g. /^open(?: opportunities)?(?:\s+\d+)?$/i, for all three groups.
    5. R-1.38: opportunityList.openGroup() read '' at /opportunities after publishing, but the page shows 'R-1.38 open opportunity whose deadline is sooner' (closes December 17, 2026) and then 'R-1.38 open opportunity whose deadline is later' (closes February 15, 2027) inside the region headed 'Open Opportunities 5' (evidence R-1.38.txt). This is the same cause as R-1.3: the OPPORTUNITY_GROUPS pattern for the open group does not allow the count that follows the heading's words, so the adapter never finds the open group's section.
